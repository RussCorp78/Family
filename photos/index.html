<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Polaroid-style photography gallery">
  <title>Paul's Photographs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../logo.png">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div>
        <h1>Paul's photographs</h1>
        <p>One frame at a time.</p>
      </div>

      <label class="search-box" for="photo-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="photo-search" type="search" placeholder="Search photos..." autocomplete="off">
      </label>
    </header>

    <section class="gallery" aria-live="polite">
      <button id="previous-button" class="arrow-button" type="button" aria-label="Previous photograph">‹</button>

      <article id="polaroid" class="polaroid">
        <div class="photo-window">
          <img id="photo-image" src="" alt="">
        </div>

        <div class="photo-details">
          <div class="title-row">
            <h2 id="photo-title"></h2>
            <time id="photo-date"></time>
          </div>
          <p id="photo-description" class="description"></p>
          <p id="photo-location" class="location"></p>
        </div>
      </article>

      <div id="no-results" class="no-results" hidden>
        <h2>No photographs found</h2>
        <p>Try another keyword.</p>
      </div>

      <button id="next-button" class="arrow-button" type="button" aria-label="Next photograph">›</button>
    </section>

    <footer>
      <span id="photo-counter">0 / 0</span>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
